<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · FF Tournament</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><header class="top"><a class="brand" href="/">⚡ FF <span>ADMIN PANEL</span></a><nav><a href="/">সাইট দেখুন ↗</a><button id="logout" class="nav-button hidden">লগআউট</button></nav></header><main class="admin-main"><section id="loginPanel" class="login-panel panel"><p class="eyebrow">RESTRICTED ACCESS</p><h2>অ্যাডমিন লগইন</h2><p class="muted">শুধু অনুমোদিত অ্যাডমিনের জন্য।</p><form id="loginForm"><label class="field">ইউজারনেম<input name="username" autocomplete="username" required></label><label class="field">পাসওয়ার্ড<input type="password" name="password" autocomplete="current-password" required></label><button class="btn">লগইন</button><div id="loginError" class="result"></div></form></section>
<div id="dashboard" class="hidden"><div class="admin-title"><div><p class="eyebrow">CONTROL CENTER</p><h1>অ্যাডমিন ড্যাশবোর্ড</h1></div><button class="btn" id="newTournament">+ নতুন টুর্নামেন্ট</button></div><div id="stats" class="stats"></div><section class="panel admin-section"><div class="section-head"><div><p class="eyebrow">MANAGE</p><h2>টুর্নামেন্ট ম্যানেজমেন্ট</h2></div></div><div id="tournamentList" class="table-wrap"></div></section><section class="panel admin-section"><div class="section-head"><div><p class="eyebrow">PAYMENT REVIEW</p><h2>বুকিং ও পেমেন্ট যাচাই</h2></div><select id="bookingFilter"><option value="all">সব বুকিং</option><option value="pending">যাচাই বাকি</option><option value="confirmed">কনফার্ম</option><option value="rejected">বাতিল</option></select></div><div id="bookingList" class="table-wrap"></div></section><section class="panel admin-section"><p class="eyebrow">SITE SETTINGS</p><h2>সাইটের সেটিংস</h2><form id="settingsForm" class="settings-grid"><label class="field">সাইটের নাম<input name="site_name" required></label><label class="field">bKash নম্বর<input name="bkash_number" required></label><label class="field">Nagad নম্বর<input name="nagad_number" required></label><label class="field">নোটিশ<input name="notice"></label><div><button class="btn">সেটিংস সেভ</button></div></form></section></div></main>
<div id="editModal" class="modal hidden"><div class="modal-box"><button id="closeEdit" class="close">×</button><p class="eyebrow">TOURNAMENT EDITOR</p><h2 id="editorTitle">টুর্নামেন্ট</h2><form id="tournamentForm" class="form-grid"><input type="hidden" name="id"><label class="field">টুর্নামেন্টের নাম<input name="title" required maxlength="100"></label><label class="field">মোড<input name="mode" required></label><label class="field">এন্ট্রি ফি (৳)<input name="entry_fee" type="number" min="0" required></label><label class="field">প্রাইজ পুল (৳)<input name="prize_pool" type="number" min="0" required></label><label class="field">তারিখ ও সময়<input name="event_date" type="datetime-local" required></label><label class="field">মোট স্লট<input name="total_slots" type="number" min="1" max="500" required></label><label class="field">স্ট্যাটাস<select name="status"><option value="upcoming">আসন্ন</option><option value="ongoing">চলমান</option><option value="completed">সম্পন্ন</option><option value="hidden">লুকানো</option></select></label><label class="field full">বিবরণ<textarea name="description" rows="2"></textarea></label><label class="field full">নিয়মাবলি<textarea name="rules" rows="3"></textarea></label><div class="field full"><button class="btn">সেভ করুন</button></div></form></div></div><div id="toast" class="toast hidden"></div><script src="/admin.js"></script></body></html>
